name: CI/CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "DeployBox.HazardHero.FunctionApp/**"
      - "DeployBox.HazardHero.AI.FunctionApp/**"
      - "terraform/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-deploy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  POSTGRES_CONNECTION_SECRET_NAME: postgres-connection-string

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: Deploy-Box/deploy-box-platform/.github/workflows/terraform-deploy.yml@b360734ba2c250c06b3a81e29f6a865fab248d24
    with:
      terraform_dir: ./terraform
      terraform_version: "1.9.x"
      use_plan_file: true
      environment: main
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  build-api-function:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish API Function
        run: dotnet publish DeployBox.HazardHero.FunctionApp/DeployBox_HazardHero_FunctionApp.csproj --configuration Release --output ./artifacts/api-function

      - name: Upload API Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-function
          path: ./artifacts/api-function
          include-hidden-files: true

  deploy-api-function:
    needs: build-api-function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download API Function artifact
        uses: actions/download-artifact@v4
        with:
          name: api-function
          path: ./artifacts/api-function

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Function
        uses: Azure/functions-action@v1
        with:
          app-name: func-smart-handicap-sign-api
          package: ./artifacts/api-function

  deploy-ai-function:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: Deploy-Box/deploy-box-platform/.github/workflows/azure-function-deploy.yml@dev
    with:
      function_app_name: func-smart-handicap-sign-ai
      package_path: DeployBox.HazardHero.AI.FunctionApp
      python_version: "3.12"
      environment: main
    secrets: inherit
