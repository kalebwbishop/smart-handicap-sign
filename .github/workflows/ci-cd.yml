name: CI/CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "DeployBox.HazardHero.FunctionApp/**"
      - "DeployBox.HazardHero.AI.FunctionApp/**"
      - "terraform/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-deploy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  POSTGRES_CONNECTION_SECRET_NAME: postgres-connection-string

jobs:
  migrate-database:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify workflow configuration
        run: |
          test -n "$ARM_CLIENT_ID" || { echo "Missing repository variable AZURE_CLIENT_ID"; exit 1; }
          test -n "$ARM_TENANT_ID" || { echo "Missing repository variable AZURE_TENANT_ID"; exit 1; }
          test -n "$ARM_SUBSCRIPTION_ID" || { echo "Missing repository variable AZURE_SUBSCRIPTION_ID"; exit 1; }
          test -n "$POSTGRES_CONNECTION_SECRET_NAME" || { echo "Missing POSTGRES_CONNECTION_SECRET_NAME configuration"; exit 1; }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false -reconfigure

      - name: Resolve Key Vault name
        id: key_vault
        working-directory: terraform
        run: |
          if ! KEY_VAULT_NAME="$(terraform output -raw key_vault_name 2>/dev/null)"; then
            echo "Expected an existing Terraform state with a key_vault_name output. Bootstrap the environment and create Key Vault secrets before using this workflow." >&2
            exit 1
          fi

          test -n "$KEY_VAULT_NAME" || { echo "Terraform output key_vault_name is empty"; exit 1; }
          printf 'name=%s\n' "$KEY_VAULT_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch database connection string
        id: db_connection
        run: |
          POSTGRES_CONNECTION_STRING="$(az keyvault secret show \
            --vault-name "${{ steps.key_vault.outputs.name }}" \
            --name "$POSTGRES_CONNECTION_SECRET_NAME" \
            --query value \
            --output tsv)"

          test -n "$POSTGRES_CONNECTION_STRING" || { echo "Key Vault secret $POSTGRES_CONNECTION_SECRET_NAME is empty"; exit 1; }
          echo "::add-mask::$POSTGRES_CONNECTION_STRING"
          printf 'value=%s\n' "$POSTGRES_CONNECTION_STRING" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        working-directory: database
        env:
          NODE_ENV: production
          POSTGRES_CONNECTION_STRING: ${{ steps.db_connection.outputs.value }}
        run: npx --yes prisma@7.8.0 migrate deploy --config prisma.config.ts

  deploy:
    needs:
      - migrate-database
    if: github.ref == 'refs/heads/main'
    uses: Deploy-Box/deploy-box-platform/.github/workflows/terraform-deploy.yml@b360734ba2c250c06b3a81e29f6a865fab248d24
    with:
      terraform_dir: ./terraform
      terraform_version: "1.9.x"
      use_plan_file: true
      environment: main
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  build-api-function:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish API Function
        run: dotnet publish DeployBox.HazardHero.FunctionApp/DeployBox_HazardHero_FunctionApp.csproj --configuration Release --output ./artifacts/api-function

      - name: Upload API Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-function
          path: ./artifacts/api-function

  deploy-api-function:
    needs: build-api-function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download API Function artifact
        uses: actions/download-artifact@v4
        with:
          name: api-function
          path: ./artifacts/api-function

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Function
        uses: Azure/functions-action@v1
        with:
          app-name: func-smart-handicap-sign-api
          package: ./artifacts/api-function

  deploy-ai-function:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: Deploy-Box/deploy-box-platform/.github/workflows/azure-function-deploy.yml@dev
    with:
      function_app_name: func-smart-handicap-sign-ai
      package_path: DeployBox.HazardHero.AI.FunctionApp
      python_version: "3.12"
      environment: main
    secrets: inherit
